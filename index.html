<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>독해 테스트 · SW-PBIS 지문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5EF;
    --surface: #FFFFFF;
    --ink: #22281F;
    --ink-soft: #5B6455;
    --line: #DEDACB;
    --accent: #2F6F63;
    --accent-ink: #FFFFFF;
    --accent-soft: #E4EEEA;
    --warn: #B5502E;
    --warn-soft: #F6E7DF;
    --good: #2F6F63;
    --good-soft: #E4EEEA;
    --mid: #9A7B2E;
    --mid-soft: #F3ECD8;
    --radius: 14px;
    --serif: "Source Serif 4", Georgia, "Noto Serif KR", serif;
    --sans: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #14170F;
      --surface: #1D2118;
      --ink: #EDEAE0;
      --ink-soft: #A6AC9C;
      --line: #33392A;
      --accent: #6FBFA8;
      --accent-ink: #0F1712;
      --accent-soft: #202C26;
      --warn: #E08A63;
      --warn-soft: #2E2119;
      --good: #6FBFA8;
      --good-soft: #1B2A24;
      --mid: #D7B25C;
      --mid-soft: #2A2517;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14170F;
    --surface: #1D2118;
    --ink: #EDEAE0;
    --ink-soft: #A6AC9C;
    --line: #33392A;
    --accent: #6FBFA8;
    --accent-ink: #0F1712;
    --accent-soft: #202C26;
    --warn: #E08A63;
    --warn-soft: #2E2119;
    --good: #6FBFA8;
    --good-soft: #1B2A24;
    --mid: #D7B25C;
    --mid-soft: #2A2517;
  }

  * { box-sizing: border-box; }

  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    min-height: 100%;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 20px 64px;
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
    gap: 12px;
  }

  header.top h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 1.15rem;
    margin: 0;
    color: var(--ink);
  }

  header.top .sub {
    font-size: 0.8rem;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .progress-track {
    height: 6px;
    background: var(--line);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 28px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.35s ease;
    width: 0%;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 28px 24px;
  }

  /* ---- start screen ---- */
  .start .kicker {
    font-size: 0.82rem;
    color: var(--ink-soft);
    margin: 0 0 6px;
  }
  .start h2 {
    font-family: var(--serif);
    font-size: 1.6rem;
    line-height: 1.35;
    margin: 0 0 14px;
  }
  .start p.desc {
    color: var(--ink-soft);
    line-height: 1.7;
    margin: 0 0 22px;
    font-size: 0.95rem;
  }
  .option-row {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .toggle {
    flex: 1 1 140px;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 0.88rem;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .toggle strong { display: block; font-size: 0.95rem; margin-bottom: 2px; }
  .toggle.active {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  button.primary {
    width: 100%;
    padding: 14px 18px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: var(--sans);
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
  }
  button.primary:active { transform: translateY(1px); }
  button.primary:focus-visible,
  .toggle:focus-visible,
  textarea:focus-visible,
  button.ghost:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  button.ghost {
    width: 100%;
    padding: 12px 18px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: transparent;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 0.92rem;
    cursor: pointer;
    margin-top: 10px;
  }

  /* ---- quiz screen ---- */
  .qnum {
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin: 0 0 10px;
  }
  .sentence-en {
    font-family: var(--serif);
    font-size: 1.28rem;
    line-height: 1.6;
    color: var(--ink);
    margin: 0 0 22px;
  }
  label.field-label {
    display: block;
    font-size: 0.82rem;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  textarea {
    width: 100%;
    min-height: 110px;
    resize: vertical;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 0.98rem;
    line-height: 1.6;
    padding: 12px 14px;
    margin-bottom: 16px;
  }

  .feedback {
    margin-top: 18px;
    padding: 16px 16px 6px;
    border-top: 1px dashed var(--line);
    animation: reveal 0.25s ease;
  }
  @keyframes reveal {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .score-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .score-badge {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 1.5rem;
    padding: 6px 14px;
    border-radius: 10px;
  }
  .score-badge.good { background: var(--good-soft); color: var(--good); }
  .score-badge.mid { background: var(--mid-soft); color: var(--mid); }
  .score-badge.low { background: var(--warn-soft); color: var(--warn); }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); }

  .answer-block {
    margin-bottom: 14px;
  }
  .answer-block .label {
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .answer-block .text {
    font-size: 0.96rem;
    line-height: 1.65;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px solid var(--line);
  }
  .answer-block.correct .text {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .nav-row {
    margin-top: 20px;
  }

  footer.hint {
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.78rem;
    margin-top: 16px;
    line-height: 1.6;
  }

  /* ---- result screen ---- */
  .result h2 {
    font-family: var(--serif);
    font-size: 1.5rem;
    margin: 0 0 4px;
  }
  .result .avg {
    font-family: var(--serif);
    font-size: 2.6rem;
    font-weight: 600;
    color: var(--accent);
    margin: 10px 0 4px;
  }
  .result .avg-label {
    color: var(--ink-soft);
    font-size: 0.88rem;
    margin-bottom: 22px;
  }
  .review-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 20px 0 24px;
    max-height: 420px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .review-item {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .review-item .row1 {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 6px;
  }
  .review-item .idx {
    font-size: 0.78rem;
    color: var(--ink-soft);
  }
  .review-item .sc {
    font-weight: 700;
    font-size: 0.9rem;
  }
  .review-item .en {
    font-family: var(--serif);
    font-size: 0.92rem;
    color: var(--ink-soft);
    margin-bottom: 4px;
    line-height: 1.5;
  }
  .review-item .ko-user {
    font-size: 0.86rem;
    color: var(--ink);
    margin-bottom: 2px;
  }
  .review-item .ko-correct {
    font-size: 0.86rem;
    color: var(--ink-soft);
  }

  @media (max-width: 420px) {
    .card { padding: 22px 16px; }
    .sentence-en { font-size: 1.14rem; }
    .start h2 { font-size: 1.35rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>📖 독해 테스트</h1>
    <div class="sub" id="topSub"></div>
  </header>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div id="app"></div>

  <footer class="hint" id="globalHint"></footer>
</div>

<script>
const DATA = [
["Schoolwide PBIS(Positive Behavior Intervention and Supports) is an exciting and effective response to the problems of school violence, disruptive behavior, high levels of disciplinary actions, and poor school climate.",
"학교 차원의 PBIS(긍정적 행동중재 및 지원)는 학교폭력, 문제행동, 잦은 징계, 나쁜 학교 분위기와 같은 문제들에 대한 흥미롭고 효과적인 대응책이다."],
["SW-PBIS extends and expands the successes of behavioral science, especially applied behavior analysis, to making schools more effective for all students.",
"SW-PBIS는 행동과학, 특히 응용행동분석의 성과를 확장하여 모든 학생을 위해 학교를 더 효과적으로 만드는 데 적용한다."],
["Positive behavioral support is a general term that refers to the application of positive behavioral interventions and systems to achieve socially important behavior change.",
"긍정적 행동지원이란 사회적으로 중요한 행동 변화를 이루기 위해 긍정적 행동중재와 시스템을 적용하는 것을 가리키는 포괄적인 용어이다."],
["Positive behavioral support is not a new intervention package, nor a new theory of behavior, but an application of a behaviorally-based systems approach to enhancing the capacity of schools, families, and communities to design effective environments that improve the fit or link between research-validated practices and the environments in which teaching and learning occur.",
"긍정적 행동지원은 새로운 중재 패키지도, 새로운 행동 이론도 아니며, 학교·가정·지역사회가 연구로 검증된 실천 방법과 실제 교수-학습이 이루어지는 환경 사이의 적합성(연결성)을 향상시키는 효과적인 환경을 설계할 수 있는 역량을 강화하기 위해 행동주의 기반의 시스템적 접근을 적용한 것이다."],
["Attention is focused on creating and sustaining school environments that improve lifestyle results (personal, health, social, family, work, recreation, etc.) for all children and youth by making problem behavior less effective, efficient, and relevant, and desired behavior more functional.",
"초점은 문제행동을 덜 효과적이고 덜 효율적이며 덜 필요하게 만들고, 바람직한 행동은 더 기능적으로 만듦으로써, 모든 아동과 청소년의 삶의 결과(개인, 건강, 사회, 가정, 직업, 여가 등)를 향상시키는 학교 환경을 만들고 유지하는 데 맞춰져 있다."],
["In addition, the use of culturally appropriate interventions is emphasized.",
"또한 문화적으로 적절한 중재를 사용하는 것이 강조된다."],
["PBIS represents a fundamental shift in managing unacceptable behavior from reactive, punitive responses to challenging behavior to a proactive emphasis on the prevention of behavioral problems by using positive, instructional, research-based strategies to teach and encourage appropriate behavior and manage the learning environment.",
"PBIS는 문제행동에 대한 반응적·처벌적 대응에서 벗어나, 긍정적이고 교육적이며 연구기반의 전략을 사용해 적절한 행동을 가르치고 격려하며 학습 환경을 관리함으로써 행동 문제를 예방하는 데 초점을 두는 사전예방적 접근으로의 근본적인 전환을 의미한다."],
["PBIS is the integrated application of (a) behavioral science, (b) practical interventions, (c) social values, and (d) a systems perspective to design interventions at the individual, classroom, and schoolwide levels for the purpose of increasing success for all students.",
"PBIS는 모든 학생의 성공을 높이기 위해 개인·학급·학교 전체 수준에서 중재를 설계하도록 (a) 행동과학, (b) 실제적 중재, (c) 사회적 가치, (d) 시스템적 관점을 통합적으로 적용한 것이다."],
["The techniques presented in this text reflect PBIS methods for preventing inappropriate behavior, teaching and encouraging appropriate behavior, and managing challenging behavior in all students, but particularly in students with mild to moderate disabilities, at the individual, classroom, and schoolwide levels.",
"이 글에서 제시된 기법들은 개인·학급·학교 전체 수준에서 부적절한 행동을 예방하고 적절한 행동을 가르치고 격려하며 문제행동을 관리하기 위한 PBIS 방법을 반영하는데, 이는 모든 학생, 특히 경도에서 중등도의 장애를 지닌 학생들에게 특히 적용된다."],
["The goal of encouraging appropriate behavior and preventing and managing inappropriate behavior is a demanding task because teachers are expected to successfully teach a wide range of students, including students who are not well prepared for the demands of school and students who are not highly motivated to behave appropriately and learn.",
"적절한 행동을 격려하고 부적절한 행동을 예방·관리하는 목표는 매우 힘든 과제인데, 이는 교사가 학교의 요구에 잘 준비되지 않은 학생과 적절히 행동하고 배우려는 동기가 낮은 학생을 포함한 다양한 학생들을 성공적으로 가르쳐야 하기 때문이다."],
["The task is complicated by the fact that schools serve a diverse population of students from varied cultural, ethnic, and religious backgrounds who have a range of abilities and learning histories.",
"이 과제는 학교가 다양한 문화적·민족적·종교적 배경을 가지고, 각기 다른 능력과 학습 이력을 지닌 다양한 학생들을 대상으로 한다는 사실 때문에 더욱 복잡해진다."],
["But the good news is that teachers have the power to meet this challenge by using a wide array of research-based tools to support appropriate behavior, to prevent and manage behavioral problems, and to deliver instruction.",
"그러나 다행히도 교사는 적절한 행동을 지원하고 행동 문제를 예방·관리하며 수업을 전달하기 위한 다양한 연구기반 도구들을 활용함으로써 이 과제를 해결할 힘을 가지고 있다."],
["Understanding the behavior assumptions will help teachers become more independent problem solvers when faced with behavioral challenges.",
"행동에 관한 이러한 가정들을 이해하면 교사는 행동 문제에 직면했을 때 더 독립적으로 문제를 해결할 수 있게 된다."],
["Changing inappropriate student behavior requires changing the teacher's behavior.",
"학생의 부적절한 행동을 바꾸려면 교사의 행동을 바꾸어야 한다."],
["Some students require more time, attention, and structure than others.",
"어떤 학생들은 다른 학생들보다 더 많은 시간, 관심, 구조화를 필요로 한다."],
["Students exhibit both desirable and undesirable behaviors for a reason.",
"학생들은 바람직한 행동이든 바람직하지 않은 행동이든 나름의 이유가 있어서 그 행동을 보인다."],
["Many behavioral challenges reflect learning difficulties.",
"많은 행동 문제는 학습의 어려움을 반영한다."],
["Most inappropriate behavior is predictably linked to specific contexts and activities.",
"대부분의 부적절한 행동은 특정한 맥락 및 활동과 예측 가능하게 연결되어 있다."],
["It is more efficient and more effective to change student behavior by using positive strategies rather than punitive strategies.",
"처벌적 전략보다 긍정적 전략을 사용하여 학생의 행동을 바꾸는 것이 더 효율적이고 효과적이다."],
["It is more efficient and effective to use proactive, preventive strategies rather than relying on reactive strategies after a behavioral problem has already developed.",
"행동 문제가 이미 발생한 후 반응적 전략에 의존하는 것보다 사전예방적 전략을 사용하는 것이 더 효율적이고 효과적이다."],
["Students benefit when general educators and special educators work together to meet the needs of all students.",
"일반교사와 특수교사가 협력하여 모든 학생의 요구를 충족시킬 때 학생들은 도움을 받는다."],
["Students benefit when educators maintain close communication with parents in order to share information and collaboratively plan educational and home programs.",
"교육자가 정보를 공유하고 교육 및 가정 프로그램을 협력적으로 계획하기 위해 부모와 긴밀한 소통을 유지할 때 학생들은 도움을 받는다."],
["A defining characteristic of SW-PBIS is its fundamental three-tiered prevention and intervention approach.",
"SW-PBIS의 핵심적인 특징은 근본적으로 3단계 예방 및 중재 접근을 취한다는 것이다."],
["This three-tiered model includes three levels of prevention and intervention that are distinguished by the number of students affected and the intensity of the support services provided.",
"이 3단계 모델은 영향을 받는 학생 수와 제공되는 지원 서비스의 강도에 따라 구분되는 세 가지 수준의 예방 및 중재를 포함한다."],
["The three levels in this model serve as a structure through which school personnel provide proactive, preventive interventions for all students, while designing timely, efficient, and effective interventions for students who need more intensive services.",
"이 모델의 세 가지 수준은 학교 직원들이 모든 학생에게 사전예방적 중재를 제공하는 동시에, 더 집중적인 서비스가 필요한 학생들을 위해 시기적절하고 효율적이며 효과적인 중재를 설계할 수 있게 하는 구조로 작동한다."],
["Because the proactive and preventive elements of SW-PBIS meet the needs of most students, school personnel are able to better focus resources on students who are unresponsive to other schoolwide strategies.",
"SW-PBIS의 사전예방적 요소가 대부분 학생의 요구를 충족시키기 때문에, 학교 직원들은 다른 학교 차원의 전략에 반응하지 않는 학생들에게 자원을 더 집중할 수 있다."],
["At the primary level(also referred to as the universal level), universal interventions are used that incorporate strategies to help ensure that all students exhibit appropriate behavior and to reduce the number of new cases of problem behavior and academic difficulties.",

let order = DATA.map((_, i) => i);
let current = 0;
let answered = false;
let results = []; // {idx, userText, score}
let mode = "sequential";

const app = document.getElementById("app");
const progressFill = document.getElementById("progressFill");
const topSub = document.getElementById("topSub");
const globalHint = document.getElementById("globalHint");

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function normalize(text) {
  return text
    .replace(/["'“”‘’.,!?;:()\[\]{}·…\-–—]/g, "")
    .replace(/\s+/g, " ")
    .trim()
    .toLowerCase();
}

function charBigrams(s) {
  const clean = s.replace(/\s+/g, "");
  const grams = [];
  for (let i = 0; i < clean.length - 1; i++) grams.push(clean.slice(i, i + 2));
  return grams;
}

function diceCoefficient(a, b) {
  const ga = charBigrams(a);
  const gb = charBigrams(b);
  if (ga.length === 0 || gb.length === 0) return ga.length === gb.length ? 1 : 0;
  const counts = new Map();
  for (const g of ga) counts.set(g, (counts.get(g) || 0) + 1);
  let overlap = 0;
  for (const g of gb) {
    const c = counts.get(g) || 0;
    if (c > 0) { overlap++; counts.set(g, c - 1); }
  }
  return (2 * overlap) / (ga.length + gb.length);
}

function jaccardWords(a, b) {
  const wa = new Set(a.split(" ").filter(Boolean));
  const wb = new Set(b.split(" ").filter(Boolean));
  if (wa.size === 0 || wb.size === 0) return wa.size === wb.size ? 1 : 0;
  let inter = 0;
  for (const w of wa) if (wb.has(w)) inter++;
  const union = new Set([...wa, ...wb]).size;
  return inter / union;
}

function scoreAnswer(userText, correctText) {
  const u = normalize(userText);
  const c = normalize(correctText);
  if (!u) return 0;
  const dice = diceCoefficient(u, c);
  const jac = jaccardWords(u, c);
  const raw = 0.65 * dice + 0.35 * jac;
  return Math.max(0, Math.min(100, Math.round(raw * 100)));
}

function scoreTier(score) {
  if (score >= 80) return "good";
  if (score >= 55) return "mid";
  return "low";
}

function scoreLabel(score) {
  if (score >= 90) return "훌륭해요";
  if (score >= 80) return "좋아요";
  if (score >= 55) return "핵심은 맞아요";
  if (score >= 30) return "조금 더 다듬어보세요";
  return "다시 확인해보세요";
}

function updateProgress() {
  const pct = Math.round((current / order.length) * 100);
  progressFill.style.width = pct + "%";
  topSub.textContent = `${Math.min(current + 1, order.length)} / ${order.length}`;
}

function renderStart() {
  topSub.textContent = "";
  progressFill.style.width = "0%";
  globalHint.textContent = "";
  app.innerHTML = `
    <div class="card start">
      <p class="kicker">SW-PBIS 독해 지문 · 총 ${DATA.length}문장</p>
      <h2>영어 문장을 읽고<br>한글 해석을 적어보세요</h2>
      <p class="desc">시험범위 지문의 모든 문장이 순서대로 출제됩니다. 문장을 읽고 한글 뜻을 적은 뒤 제출하면, 정답과 함께 참고용 유사도 점수를 보여줘요.</p>
      <div class="option-row">
        <button class="toggle active" id="optSeq"><strong>순서대로</strong>지문 순서 그대로 풀기</button>
        <button class="toggle" id="optShuffle"><strong>무작위 순서</strong>섞어서 풀기</button>
      </div>
      <button class="primary" id="startBtn">시작하기</button>
    </div>
  `;
  document.getElementById("optSeq").onclick = () => setMode("sequential");
  document.getElementById("optShuffle").onclick = () => setMode("shuffle");
  document.getElementById("startBtn").onclick = startQuiz;
}

function setMode(m) {
  mode = m;
  document.getElementById("optSeq").classList.toggle("active", m === "sequential");
  document.getElementById("optShuffle").classList.toggle("active", m === "shuffle");
}

function startQuiz() {
  order = mode === "shuffle" ? shuffle(DATA.map((_, i) => i)) : DATA.map((_, i) => i);
  current = 0;
  results = [];
  answered = false;
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  updateProgress();
  const item = DATA[order[current]];
  globalHint.textContent = "Ctrl/⌘+Enter 로도 제출할 수 있어요.";
  app.innerHTML = `
    <div class="card">
      <p class="qnum">문제 ${current + 1}</p>
      <p class="sentence-en">${escapeHtml(item.en)}</p>
      <label class="field-label" for="answerBox">이 문장의 한글 해석을 적어보세요</label>
      <textarea id="answerBox" placeholder="여기에 한글로 해석을 입력하세요..."></textarea>
      <button class="primary" id="submitBtn">제출</button>
      <div id="feedbackSlot"></div>
    </div>
  `;
  const box = document.getElementById("answerBox");
  box.focus();
  box.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      submitAnswer();
    }
  });
  document.getElementById("submitBtn").onclick = submitAnswer;
}

function submitAnswer() {
  if (answered) return;
  answered = true;
  const item = DATA[order[current]];
  const userText = document.getElementById("answerBox").value;
  const score = scoreAnswer(userText, item.ko);
  results.push({ idx: order[current], userText: userText.trim(), score });

  const tier = scoreTier(score);
  const isLast = current === order.length - 1;

  document.getElementById("submitBtn").remove();
  document.getElementById("answerBox").setAttribute("disabled", "true");

  const slot = document.getElementById("feedbackSlot");
  slot.innerHTML = `
    <div class="feedback">
      <div class="score-row">
        <div class="score-badge ${tier}">${score}점</div>
        <div class="score-note">${scoreLabel(score)} · 핵심 어휘·의미 일치도를 어림한 참고용 점수예요</div>
      </div>
      <div class="answer-block">
        <div class="label">내가 쓴 답</div>
        <div class="text">${userText.trim() ? escapeHtml(userText.trim()) : "(입력 없음)"}</div>
      </div>
      <div class="answer-block correct">
        <div class="label">정답 해석</div>
        <div class="text">${escapeHtml(item.ko)}</div>
      </div>
      <div class="nav-row">
        <button class="primary" id="nextBtn">${isLast ? "결과 보기" : "다음 문제"}</button>
      </div>
    </div>
  `;
  document.getElementById("nextBtn").onclick = () => {
    if (isLast) {
      renderResult();
    } else {
      current++;
      renderQuestion();
    }
  };
}

function renderResult() {
  progressFill.style.width = "100%";
  topSub.textContent = `${order.length} / ${order.length}`;
  globalHint.textContent = "";
  const avg = Math.round(results.reduce((s, r) => s + r.score, 0) / results.length);
  const goodCount = results.filter((r) => r.score >= 80).length;

  const rows = order
    .map((di, i) => {
      const r = results[i];
      const item = DATA[di];
      const tier = scoreTier(r.score);
      const colorVar = tier === "good" ? "var(--good)" : tier === "mid" ? "var(--mid)" : "var(--warn)";
      return `
        <div class="review-item">
          <div class="row1">
            <span class="idx">문제 ${i + 1}</span>
            <span class="sc" style="color:${colorVar}">${r.score}점</span>
          </div>
          <div class="en">${escapeHtml(item.en)}</div>
          <div class="ko-user">내 답: ${r.userText ? escapeHtml(r.userText) : "(입력 없음)"}</div>
          <div class="ko-correct">정답: ${escapeHtml(item.ko)}</div>
        </div>`;
    })
    .join("");

  app.innerHTML = `
    <div class="card result">
      <h2>테스트 완료</h2>
      <div class="avg">${avg}점</div>
      <div class="avg-label">평균 점수 · ${order.length}문항 중 80점 이상 ${goodCount}개</div>
      <div class="review-list">${rows}</div>
      <button class="primary" id="retryBtn">다시 풀기</button>
      <button class="ghost" id="homeBtn">처음 화면으로</button>
    </div>
  `;
  document.getElementById("retryBtn").onclick = startQuiz;
  document.getElementById("homeBtn").onclick = renderStart;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

renderStart();
</script>
</body>
</html>
